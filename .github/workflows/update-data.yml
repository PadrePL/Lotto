name: Aktualizacja wyników

# Trzy razy dziennie pobiera aktualne wyniki i zapisuje je w folderze data.
# Lotto, Lotto Plus, Mini Lotto i Eurojackpot pochodzą z mbnet.com.pl,
# Keno z multipasko.pl (1000 ostatnich losowań przy każdym pobraniu);
# plik keno.csv rośnie z każdym uruchomieniem, do 20 000 losowań.
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz Lotto, Lotto Plus, Mini Lotto i Eurojackpot
        run: |
          mkdir -p data
          for f in lotto lotto-plus mini-lotto eurojackpot; do
            curl -fsSL "https://www.mbnet.com.pl/bazy/$f.csv" -o "data/$f.csv.tmp"
            test "$(wc -l < "data/$f.csv.tmp")" -gt 10
            mv "data/$f.csv.tmp" "data/$f.csv"
          done

      - name: Pobierz Keno
        continue-on-error: true
        shell: python
        run: |
          import csv, io, json, os, sys, urllib.request, datetime
          from zoneinfo import ZoneInfo
          PATH = "data/keno.csv"
          KEEP = 20000          # ile ostatnich losowań trzymać w pliku
          HDR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                               "(KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                 "Accept": "*/*", "Accept-Language": "pl-PL,pl;q=0.9"}
          rows = {}             # numer losowania -> (data, godzina, liczby)

          # 1. Wyniki zebrane wcześniej (plik rośnie z każdym uruchomieniem)
          if os.path.exists(PATH):
              for line in open(PATH, encoding="utf-8"):
                  p = line.strip().split(";")
                  if (len(p) >= 4 and p[0].isdigit() and len(p[1]) == 10
                          and len(p[3].split(",")) == 20):
                      rows[int(p[0])] = (p[1], p[2], p[3])
          print("Było w pliku:", len(rows))

          def get(url):
              req = urllib.request.Request(url, headers=HDR)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8-sig", errors="replace")

          # 2. multipasko.pl: 1000 ostatnich losowań w CSV
          try:
              text = get("https://www.multipasko.pl/wyniki-csv.php?f=keno")
              added = 0
              for p in csv.reader(io.StringIO(text), delimiter=";"):
                  if len(p) < 25 or not p[0].strip().isdigit():
                      continue
                  nums = sorted(int(x) for x in p[5:25])
                  if len(set(nums)) != 20 or not all(1 <= x <= 70 for x in nums):
                      continue
                  date = f"{int(p[3]):04d}-{int(p[2]):02d}-{int(p[1]):02d}"
                  rows[int(p[0])] = (date, p[4].strip()[:5], ",".join(map(str, nums)))
                  added += 1
              print("multipasko.pl:", added)
          except Exception as e:
              print("multipasko.pl nie odpowiedział:", e)

          # 3. lotto.pl (próba dodatkowa, może być zablokowana)
          try:
              waw = ZoneInfo("Europe/Warsaw")
              url = ("https://www.lotto.pl/api/lotteries/draw-results/by-gametype"
                     "?game=Keno&index=1&size=500&sort=drawDate&order=DESC")
              data = json.loads(get(url))
              items = data.get("items") if isinstance(data, dict) else data
              added = 0
              for it in items or []:
                  for res in it.get("results") or [it]:
                      nums = res.get("resultsJson") or []
                      sid = res.get("drawSystemId") or it.get("drawSystemId")
                      raw = res.get("drawDate") or it.get("drawDate") or ""
                      if len(nums) != 20 or not sid or not raw:
                          continue
                      dt = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      if dt.tzinfo:
                          dt = dt.astimezone(waw)
                      rows[int(sid)] = (f"{dt:%Y-%m-%d}", f"{dt:%H:%M}",
                                        ",".join(map(str, sorted(int(x) for x in nums))))
                      added += 1
              print("lotto.pl:", added)
          except Exception as e:
              print("lotto.pl nie odpowiedział:", e)

          if len(rows) < 100:
              sys.exit("Nie udało się pobrać wyników Keno, plik bez zmian.")
          keep = sorted(rows)[-KEEP:]
          with open(PATH, "w", encoding="utf-8") as f:
              f.write("numer;data;godzina;liczby;dodatkowe;mnoznik;premia\n")
              for sid in keep:
                  d, t, n = rows[sid]
                  f.write(f"{sid};{d};{t};{n};;;\n")
          print("Zapisano losowań Keno:", len(keep))

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak nowych wyników."
          else
            git commit -m "Aktualizacja wyników"
            git push
          fi
