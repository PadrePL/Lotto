name: Aktualizacja wyników

# Dwa razy dziennie pobiera aktualne wyniki i zapisuje je w folderze data.
# Lotto, Lotto Plus, Mini Lotto i Eurojackpot pochodzą z mbnet.com.pl,
# Keno z lotto.pl (ostatnie ok. 10 000 losowań).
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz Lotto, Lotto Plus, Mini Lotto i Eurojackpot
        run: |
          mkdir -p data
          for f in lotto lotto-plus mini-lotto eurojackpot; do
            curl -fsSL "https://www.mbnet.com.pl/bazy/$f.csv" -o "data/$f.csv.tmp"
            test "$(wc -l < "data/$f.csv.tmp")" -gt 10
            mv "data/$f.csv.tmp" "data/$f.csv"
          done

      - name: Pobierz Keno
        continue-on-error: true
        shell: python
        run: |
          import json, urllib.request, datetime, sys
          from zoneinfo import ZoneInfo
          WAW = ZoneInfo("Europe/Warsaw")
          URL = ("https://www.lotto.pl/api/lotteries/draw-results/by-gametype"
                 "?game=Keno&index={i}&size={s}&sort=drawDate&order=DESC")
          rows = {}
          size, want = 500, 10000
          for i in range(1, 41):
              req = urllib.request.Request(URL.format(i=i, s=size), headers={
                  "User-Agent": "Mozilla/5.0", "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = json.load(r)
              items = data.get("items") if isinstance(data, dict) else data
              if not items:
                  break
              for it in items:
                  results = it.get("results") or [it]
                  for res in results:
                      game = res.get("gameType") or it.get("gameType") or ""
                      if game.lower() != "keno":
                          continue
                      nums = res.get("resultsJson") or []
                      if len(nums) != 20:
                          continue
                      sid = res.get("drawSystemId") or it.get("drawSystemId")
                      raw = res.get("drawDate") or it.get("drawDate") or ""
                      try:
                          dt = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                          if dt.tzinfo:
                              dt = dt.astimezone(WAW)
                      except ValueError:
                          continue
                      rows[int(sid)] = (dt, sorted(int(x) for x in nums))
              if len(rows) >= want:
                  break
          print("Pobrano losowań Keno:", len(rows))
          if len(rows) < 100:
              sys.exit("Za mało wyników Keno, plik bez zmian.")
          lines = ["numer;data;godzina;liczby;dodatkowe;mnoznik;premia"]
          for sid in sorted(rows):
              dt, nums = rows[sid]
              lines.append(f"{sid};{dt:%Y-%m-%d};{dt:%H:%M};{','.join(map(str, nums))};;;")
          open("data/keno.csv", "w", encoding="utf-8").write("\n".join(lines) + "\n")

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak nowych wyników."
          else
            git commit -m "Aktualizacja wyników"
            git push
          fi
