name: Aktualizacja wyników

# Codziennie wieczorem pobiera aktualne pliki z wynikami z mbnet.com.pl
# i zapisuje je w folderze data. Aplikacja czyta je spod własnego adresu.
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz pliki z wynikami
        run: |
          mkdir -p data
          for f in lotto lotto-plus mini-lotto eurojackpot; do
            curl -fsSL "https://www.mbnet.com.pl/bazy/$f.csv" -o "data/$f.csv.tmp"
            test "$(wc -l < "data/$f.csv.tmp")" -gt 10
            mv "data/$f.csv.tmp" "data/$f.csv"
          done

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak nowych wyników."
          else
            git commit -m "Aktualizacja wyników"
            git push
          fi
